[workspace]
members = ["claude-audit", "codex-audit"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
