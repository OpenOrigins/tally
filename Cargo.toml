[workspace]
members = ["claude", "common", "codex"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
getrandom = "0.3"
rpassword = "7"
serde_json = "1"
sha2 = "0.10"
tally-common = { path = "common" }
tiny_http = "0.12"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
