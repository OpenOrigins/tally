name: LangGraph Integration

on:
  pull_request:
    paths:
      - ".github/workflows/langgraph.yml"
      - "integrations/langgraph/**"
  push:
    branches:
      - dev
      - main
      - langgraph
    paths:
      - ".github/workflows/langgraph.yml"
      - "integrations/langgraph/**"

permissions:
  contents: read

concurrency:
  group: langgraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"
    defaults:
      run:
        working-directory: integrations/langgraph
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check package
        run: python -m mypy --strict src/tally_langgraph

      - name: Test
        run: python -m pytest

      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: python -m build

      - name: Check distributions
        if: matrix.python-version == '3.14'
        run: python -m twine check dist/*

  minimum-langgraph:
    name: LangGraph 0.2.60 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/langgraph
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install minimum LangGraph and package
        run: |
          python -m pip install \
            "langgraph==0.2.60" \
            "pytest>=8,<10" \
            "pytest-cov>=5,<8" \
            "certifi>=2024.2.2" \
            "python-dotenv>=1,<2"
          python -m pip install --no-deps .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Test against minimum LangGraph
        run: python -m pytest

      - name: Run examples against minimum LangGraph
        env:
          TALLY_FORWARDING_ENABLED: "0"
        run: |
          TALLY_STATE_DIR="${{ runner.temp }}/tally-langgraph-basic" python examples/basic_agent.py
          TALLY_STATE_DIR="${{ runner.temp }}/tally-langgraph-handoff" python examples/handoff_agent.py
