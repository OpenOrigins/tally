name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install locked audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run release checks
        run: ./scripts/release-check.sh

  native:
    name: Native smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
            target: x86_64-unknown-linux-musl
            macos_deployment_target: ""
            executable_suffix: ""
          - os: windows-2025
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            macos_deployment_target: ""
            executable_suffix: .exe
          - os: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
            executable_suffix: ""
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            macos_deployment_target: "10.15"
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux static linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build release installer
        run: cargo build --package tally --release --locked --target ${{ matrix.target }}

      - name: Test installation and records as an end user
        run: >-
          python tests/native_install_smoke.py
          --tally target/${{ matrix.target }}/release/tally${{ matrix.executable_suffix }}

      - name: Preserve push-test ingest behavior
        run: python tests/test_push_test_logs.py

      - name: Test release packaging
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}
