name: Dev2 Native Build

on:
  push:
    branches:
      - dev2-all-platforms
  workflow_dispatch:
  workflow_call:
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:
        required: true
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_KEY:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: dev2-native-${{ github.ref }}
  cancel-in-progress: true

env:
  TALLY_DEFAULT_API_URL: https://api.dev2.openorigins.com/v1/tally/logs
  TALLY_EXPECTED_DEFAULT_API_URL: https://api.dev2.openorigins.com/v1/tally/logs

jobs:
  build:
    name: Build (${{ matrix.label }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            deployment_target: ""
            executable_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            deployment_target: ""
            executable_suffix: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            deployment_target: "11.0"
            executable_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            deployment_target: "10.15"
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux static linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./scripts/install-musl-tools.sh

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build Dev2 installer
        run: cargo build --package tally --release --locked --target ${{ matrix.target }}

      - name: Verify Dev2 build and installation
        run: >-
          python tests/native_install_smoke.py
          --tally target/${{ matrix.target }}/release/tally${{ matrix.executable_suffix }}

      - name: Preserve push-test ingest behavior
        run: python tests/test_push_test_logs.py

      - name: Prepare Apple signing and notarization
        if: startsWith(matrix.label, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/tally-signing.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          original_keychains_path="$RUNNER_TEMP/original-user-keychains.txt"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          security list-keychains -d user > "$original_keychains_path"
          original_keychains=()
          while IFS= read -r line; do
            line="${line#*\"}"
            line="${line%\"}"
            [[ -n "$line" ]] && original_keychains+=("$line")
          done < "$original_keychains_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identity_line="$(security find-identity -v -p codesigning | awk '/Developer ID Application/ { print; exit }')"
          if [[ -z "$identity_line" || "$identity_line" != *"($APPLE_TEAM_ID)"* ]]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID"
            exit 1
          fi
          identity="$(awk '{ print $2 }' <<< "$identity_line")"

          {
            echo "APPLE_DEVELOPER_IDENTITY=$identity"
            echo "APPLE_ORIGINAL_KEYCHAINS=$original_keychains_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
            echo "APPLE_NOTARY_KEY_PATH=$notary_key_path"
            echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package signed and notarized macOS installer
        if: startsWith(matrix.label, 'macos-')
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}
          --require-macos-notarization

      - name: Package graphical installer
        if: ${{ !startsWith(matrix.label, 'macos-') }}
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}

      - name: Test packaged application hooks
        if: startsWith(matrix.label, 'macos-')
        run: >-
          python tests/macos_dmg_install_smoke.py
          --dmg dist/tally-${{ matrix.label }}.dmg

      - name: Name Dev2 artifact and write checksum
        shell: bash
        run: |
          suffix="${{ startsWith(matrix.label, 'macos-') && '.dmg' || matrix.executable_suffix }}"
          source="dist/tally-${{ matrix.label }}${suffix}"
          destination="dist/tally-dev2-${{ matrix.label }}${suffix}"
          mv "$source" "$destination"
          python - "$destination" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          artifact = Path(sys.argv[1])
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          artifact.with_suffix(artifact.suffix + ".sha256").write_bytes(
              f"{digest}  {artifact.name}\n".encode("ascii")
          )
          PY

      - name: Upload Dev2 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tally-dev2-${{ matrix.label }}
          path: dist/tally-dev2-${{ matrix.label }}*
          if-no-files-found: error

      - name: Remove temporary Apple signing keychain
        if: always() && startsWith(matrix.label, 'macos-')
        shell: bash
        run: |
          if [[ -f "${APPLE_ORIGINAL_KEYCHAINS:-}" ]]; then
            original_keychains=()
            while IFS= read -r line; do
              line="${line#*\"}"
              line="${line%\"}"
              [[ -n "$line" ]] && original_keychains+=("$line")
            done < "$APPLE_ORIGINAL_KEYCHAINS"
            security list-keychains -d user -s "${original_keychains[@]}" || true
          fi
          if [[ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi
