name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be refreshed
        required: true
        type: string

permissions:
  contents: write

env:
  TESTED_CODEX_VERSION: "0.149.1"
  TESTED_CLAUDE_VERSION: "2.1.223"

jobs:
  build:
    name: Build (${{ matrix.label }})
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            macos_deployment_target: ""
            executable_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            macos_deployment_target: ""
            executable_suffix: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_deployment_target: "11.0"
            executable_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_deployment_target: "10.15"
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux static linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ./scripts/install-musl-tools.sh

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        run: python scripts/check_release_tag.py ${{ github.ref_name }}

      - name: Verify workspace package version
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_release_tag.py ${{ inputs.release_tag }}

      - name: Test release target
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build release installer
        run: cargo build --package tally --release --locked --target ${{ matrix.target }}

      - name: Test installation and records as an end user
        run: >-
          python tests/native_install_smoke.py
          --tally target/${{ matrix.target }}/release/tally${{ matrix.executable_suffix }}

      - name: Preserve push-test ingest behavior
        run: python tests/test_push_test_logs.py

      - name: Prepare Apple signing and notarization
        if: startsWith(matrix.label, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/tally-signing.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          original_keychains_path="$RUNNER_TEMP/original-user-keychains.txt"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          security list-keychains -d user > "$original_keychains_path"
          original_keychains=()
          while IFS= read -r line; do
            line="${line#*\"}"
            line="${line%\"}"
            [[ -n "$line" ]] && original_keychains+=("$line")
          done < "$original_keychains_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identity_line="$(security find-identity -v -p codesigning | awk '/Developer ID Application/ { print; exit }')"
          if [[ -z "$identity_line" || "$identity_line" != *"($APPLE_TEAM_ID)"* ]]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID"
            exit 1
          fi
          identity="$(awk '{ print $2 }' <<< "$identity_line")"

          {
            echo "APPLE_DEVELOPER_IDENTITY=$identity"
            echo "APPLE_ORIGINAL_KEYCHAINS=$original_keychains_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
            echo "APPLE_NOTARY_KEY_PATH=$notary_key_path"
            echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package signed and notarized macOS installers
        if: startsWith(matrix.label, 'macos-')
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}
          --require-macos-notarization

      - name: Package graphical installer
        if: ${{ !startsWith(matrix.label, 'macos-') }}
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}

      - name: Test hooks from packaged macOS app
        if: startsWith(matrix.label, 'macos-')
        run: >-
          python tests/macos_dmg_install_smoke.py
          --dmg dist/tally-${{ matrix.label }}.dmg

      - name: Remove temporary Apple signing keychain
        if: always() && startsWith(matrix.label, 'macos-')
        shell: bash
        run: |
          if [[ -f "${APPLE_ORIGINAL_KEYCHAINS:-}" ]]; then
            original_keychains=()
            while IFS= read -r line; do
              line="${line#*\"}"
              line="${line%\"}"
              [[ -n "$line" ]] && original_keychains+=("$line")
            done < "$APPLE_ORIGINAL_KEYCHAINS"
            security list-keychains -d user -s "${original_keychains[@]}" || true
          fi
          if [[ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  build-dev2-macos:
    name: Build Dev2 macOS installers
    uses: ./.github/workflows/dev2-macos.yml
    secrets: inherit

  publish:
    needs:
      - build
      - build-dev2-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev

      - name: Download tested production release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Keep Dev2 installers out of the release
        shell: bash
        run: |
          if find dist -type f -iname '*dev2*' -print -quit | grep -q .; then
            echo "::error::Dev2 test artifacts must not be published"
            exit 1
          fi

      - name: Create one checksum manifest
        working-directory: dist
        run: sha256sum tally-* > SHA256SUMS

      - name: Generate Homebrew cask
        if: github.event_name == 'push'
        run: >-
          python scripts/generate_homebrew_cask.py
          --dist dist
          --output generated/tally.rb
          --release-tag ${{ github.ref_name }}

      - name: Publish tagged GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tally-macos-arm64.dmg
            dist/tally-macos-x86_64.dmg
            dist/tally-windows-x86_64.exe
            dist/tally-linux-x86_64
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Tally installs audit logging for Codex and Claude Code from one small graphical installer.

            ## Install

            Generate an Agent API key in the OpenOrigins dashboard.

            **Homebrew (macOS):**

            ```sh
            brew tap openorigins/tally https://github.com/OpenOrigins/tally
            brew install --cask tally
            ```

            **macOS:** Download the `.dmg` for your Mac architecture, open it, drag Tally to Applications, then open Tally. The app and disk image are signed with OpenOrigins' Apple Developer ID and notarized by Apple.

            **Windows:** Download and open `tally-windows-x86_64.exe`. Windows signing is not yet available, so SmartScreen may require **More info** > **Run anyway**.

            **Linux:** Download `tally-linux-x86_64`, allow it to run, and open it.

            Choose Codex, Claude Code, or both in the installer. Tally stores the dashboard Agent API key locally, installs the selected hooks, and confirms each selected client with the dashboard. Codex users must install Codex CLI first, then run `codex`, review the new OpenOrigins Tally hooks, press `t` to trust all, and reopen Codex Desktop.

            ## Compatibility

            Tested with Codex CLI/Desktop `${{ env.TESTED_CODEX_VERSION }}` and Claude Code `${{ env.TESTED_CLAUDE_VERSION }}`.

            Tally is expected to remain compatible with Codex versions that support lifecycle hooks in `config.toml` and the `notify` callback, and Claude Code versions that support command hooks. Tally never writes Codex hook trust hashes or bypasses Codex CLI approval.

      - name: Open Homebrew cask update pull request
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p Casks
          cp generated/tally.rb Casks/tally.rb
          if git diff --quiet -- Casks/tally.rb; then
            exit 0
          fi
          cask_branch="chore/homebrew-${RELEASE_TAG#v}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$cask_branch"
          git add Casks/tally.rb
          git commit \
            -m "Update Homebrew cask for $RELEASE_TAG" \
            -m "Signed-off-by: Ekaterina Pavlova <ekaterina@openorigins.com>"
          git push --set-upstream origin "$cask_branch"
          gh pr create \
            --base dev \
            --head "$cask_branch" \
            --title "Update Homebrew cask for $RELEASE_TAG" \
            --body "Promotes the checksummed Homebrew cask generated from the published $RELEASE_TAG assets."

      - name: Refresh existing release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/tally-* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update refreshed release instructions
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: |
            Tally installs audit logging for Codex and Claude Code from one graphical installer.

            ## Install

            Generate an Agent API key in the OpenOrigins dashboard.

            - **Homebrew (macOS):** Run `brew tap openorigins/tally https://github.com/OpenOrigins/tally`, then `brew install --cask tally`. Open Tally from Applications.
            - **macOS:** Download the `.dmg` for your Mac, open it, drag Tally to Applications, and open Tally.
            - **Windows:** Download and open `tally-windows-x86_64.exe`. The executable is currently unsigned, so SmartScreen may require **More info** > **Run anyway**; managed enterprise devices may block it.
            - **Linux:** Download `tally-linux-x86_64`, allow it to run, and open it.

            Choose Codex, Claude Code, or both. The installer asks for the Agent API key, stores it locally, installs the selected hooks, and confirms each selected client with the dashboard. Codex users must install Codex CLI first, then run `codex`, review the new OpenOrigins Tally hooks, press `t` to trust all, and reopen Codex Desktop.

            ## Compatibility

            Tested with Codex CLI/Desktop `${{ env.TESTED_CODEX_VERSION }}` and Claude Code `${{ env.TESTED_CLAUDE_VERSION }}`.

            Tally is expected to remain compatible with Codex versions that support lifecycle hooks in `config.toml` and the `notify` callback, and Claude Code versions that support command hooks. Tally never writes Codex hook trust hashes or bypasses Codex CLI approval.

            macOS apps and disk images are signed with OpenOrigins' Apple Developer ID and notarized by Apple. These assets were refreshed from tested commit `${{ github.sha }}` while retaining this existing release URL.
        run: gh release edit "$RELEASE_TAG" --notes "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY"
