name: Native Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            macos_deployment_target: ""
            executable_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            macos_deployment_target: ""
            executable_suffix: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_deployment_target: "11.0"
            executable_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_deployment_target: "10.15"
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux static linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        run: python scripts/check_release_tag.py ${{ github.ref_name }}

      - name: Test release target
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build release executables
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Test installation and records as an end user
        run: >-
          python tests/native_install_smoke.py
          --codex target/${{ matrix.target }}/release/tally-codex${{ matrix.executable_suffix }}
          --claude target/${{ matrix.target }}/release/tally-claude${{ matrix.executable_suffix }}

      - name: Preserve push-test ingest behavior
        run: python tests/test_push_test_logs.py

      - name: Package macOS installers and checksums
        if: startsWith(matrix.label, 'macos-')
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}
          --require-macos-notarization

      - name: Package executables and checksums
        if: ${{ !startsWith(matrix.label, 'macos-') }}
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
