name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be refreshed
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            macos_deployment_target: ""
            executable_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            macos_deployment_target: ""
            executable_suffix: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_deployment_target: "11.0"
            executable_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_deployment_target: "10.15"
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux static linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        run: python scripts/check_release_tag.py ${{ github.ref_name }}

      - name: Verify workspace package version
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_release_tag.py

      - name: Test release target
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Build release executables
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Require Windows signing configuration
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $required = @{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_ENDPOINT = $env:SIGNING_ENDPOINT
            AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME = $env:SIGNING_ACCOUNT
            AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME = $env:SIGNING_PROFILE
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace($_.Value)
          } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Windows releases require Artifact Signing configuration: $($missing -join ', ')"
          }

      - name: Authenticate to Azure for Windows signing
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\target\${{ matrix.target }}\release\tally-codex.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\tally-claude.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows publisher signatures
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $files = @(
            "target\${{ matrix.target }}\release\tally-codex.exe",
            "target\${{ matrix.target }}\release\tally-claude.exe"
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne "Valid") {
              throw "$file has invalid Authenticode status: $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "$file does not have a trusted timestamp"
            }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Test installation and records as an end user
        run: >-
          python tests/native_install_smoke.py
          --codex target/${{ matrix.target }}/release/tally-codex${{ matrix.executable_suffix }}
          --claude target/${{ matrix.target }}/release/tally-claude${{ matrix.executable_suffix }}

      - name: Preserve push-test ingest behavior
        run: python tests/test_push_test_logs.py

      - name: Package executables and checksums
        run: >-
          python scripts/package_release.py
          --target ${{ matrix.target }}
          --label ${{ matrix.label }}

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Publish tagged GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Refresh existing release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          for agent in codex claude; do
            for architecture in arm64 x86_64; do
              legacy="tally-$agent-macos-$architecture.tar.gz"
              gh release delete-asset "$RELEASE_TAG" "$legacy" --yes --repo "$GITHUB_REPOSITORY" || true
              gh release delete-asset "$RELEASE_TAG" "$legacy.sha256" --yes --repo "$GITHUB_REPOSITORY" || true
            done
          done

      - name: Update refreshed release instructions
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: |
            Tally records Codex and Claude Code activity as structured audit logs.

            ## Install

            Generate an Agent API key in the OpenOrigins dashboard.

            - **macOS:** Download the `-app.zip` for your Mac. It extracts directly to `Tally Codex.app` or `Tally Claude Code.app`; open that app. Terminal users can download the separate `-cli.tar.gz`.
            - **Windows:** Download and run the `.exe` for Codex or Claude Code.
            - **Linux:** Make the downloaded file executable and run it from a terminal.

            The graphical installer asks for the Agent API key, stores it locally, installs hooks, and confirms the client with the dashboard. CLI installation remains available with `install --api-key <agent-api-key>`.

            macOS applications have a verified ad-hoc bundle signature but are not Apple-notarized, so Gatekeeper may require **Open Anyway**. These assets were refreshed from tested commit `${{ github.sha }}` while retaining this existing release URL.
        run: gh release edit "$RELEASE_TAG" --notes "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY"
