log_dir = "/var/log/tally-codex/codex-native"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
hooks = true

[shell_environment_policy]
inherit = "core"
include = ["BASH_ENV", "TALLY_*"]
exclude = [
  "*_KEY",
  "*_TOKEN",
  "*_SECRET",
  "*PASSWORD*",
  "*COOKIE*",
  "OPENAI_API_KEY",
  "CODEX_API_KEY",
  "CODEX_ACCESS_TOKEN",
]
