[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-langgraph"
version = "0.1.0"
description = "Durable Tally audit records for LangGraph and LangChain applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "OpenOrigins", email = "hello@openorigins.com" },
]
keywords = ["audit", "langchain", "langgraph", "observability", "tally"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.2.60,<2",
]
test = [
  "build>=1.2,<2",
  "langgraph>=0.2.60,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.urls]
Documentation = "https://github.com/OpenOrigins/tally/tree/main/integrations/langgraph"
Issues = "https://github.com/OpenOrigins/tally/issues"
Repository = "https://github.com/OpenOrigins/tally"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tally_langgraph = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=tally_langgraph --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]
